services:
  redis:
    image: redis:7-alpine
    # Порт навмисно не публікуємо: Redis без пароля не можна відкривати в інтернет.
    # Бот підключається до нього всередині docker-мережі (redis://redis:6379).
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    # Контекст — корінь репо: сервер використовує ігрові модулі бота (server/src/bot.js).
    build:
      context: .
      dockerfile: server/Dockerfile
    # Порт відкритий назовні: Mini App ходить сюди через проксі Netlify
    # (miniapp/netlify/edge-functions/api.js, змінна API_ORIGIN у Netlify).
    # Усе під /api, крім /api/catalog, вимагає підписаний Telegram initData.
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      # Лише Mini App з Netlify може звертатися до API напряму з браузера.
      MINIAPP_ORIGINS: https://svitodiy.netlify.app
      # Модулі бота інколи просять позачерговий бекап (дошка «Настя»). Справжній
      # бекап робить контейнер бота кожні 2 хв, тож тут пишемо в тимчасову папку.
      REDIS_BACKUP_FILE: /tmp/svitodiy-backup/redis-user-backup.json
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TZ: Europe/Kyiv
      SERVER_URL: http://server:3000
      REDIS_URL: redis://redis:6379
      # Кнопка «Відкрити» в меню чату веде на Mini App.
      MINIAPP_URL: https://svitodiy.netlify.app
      # Бекап прогресу пишемо на змонтовану папку хоста — переживає
      # перезапуск/перебудову контейнера і навіть `docker compose down -v`.
      REDIS_BACKUP_FILE: /app/data/redis-user-backup.json
      # Моніторинг у розділі «Адмін»: усі контейнери хоста (через проксі лише
      # на читання) і процеси хоста (його /proc, змонтований read-only).
      DOCKER_API_URL: http://docker-proxy:2375
      HOST_PROC: /host/proc
    volumes:
      - ./data:/app/data
      - /proc:/host/proc:ro
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped

  # Бот НЕ отримує docker.sock напряму (це було б рівнозначно root на сервері).
  # Проксі пропускає лише GET-запити до /containers — список, стан, статистику.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  redis-data:
